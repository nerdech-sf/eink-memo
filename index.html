<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Paper Memo</title>
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 1.2em auto; padding: 0 1em; }
  h2 { margin: 0 0 .6em; }
  h3 { margin: 1.2em 0 .4em; font-size: 1em; }
  button { padding: .55em 1.2em; font-size: 16px; margin-right: .4em; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  input, textarea { font-size: 16px; box-sizing: border-box; }
  textarea { width: 100%; }
  #status { margin: .6em 0; padding: .5em .8em; background: #eee; border-radius: 6px; }
  .row { display: flex; gap: .4em; margin-bottom: .4em; }
  .row input[type=time] { width: 8em; }
  .row input[type=text] { flex: 1; min-width: 0; }
  .row button { padding: .3em .7em; margin: 0; }
  pre { background: #f6f6f6; padding: .6em; border-radius: 6px; white-space: pre-wrap; min-height: 3em; }
  .note { color: #666; font-size: 14px; }
  #warn { color: crimson; font-size: 14px; }
</style>
</head>
<body>
<h2>E-Paper Memo</h2>

<div id="status">未接続</div>
<button id="conn">接続</button>

<h3>今日の予定</h3>
<div id="rows"></div>
<button id="add">＋ 予定を追加</button>

<h3>メモ</h3>
<textarea id="memo" rows="4" placeholder="自由なメモ（予定の下に表示）"></textarea>

<h3>画面に出る内容</h3>
<pre id="preview"></pre>
<div><span id="count" class="note">0 / 1000</span> <span id="warn"></span></div>

<p>
  <button id="send" disabled>画面に反映</button>
  <button id="clear">全部消す</button>
</p>

<p class="note">
  画面に出せるのは、半角の英数字と記号のみです。<br>
  ChromeまたはEdgeで開いてください。
</p>

<script>
const SERVICE = '6e2f0001-b5a3-f393-e0a9-e50e24dcca9e';
const CHAR    = '6e2f0002-b5a3-f393-e0a9-e50e24dcca9e';
const CHUNK   = 100;           // 送信に失敗する場合は 19 に下げる
const KEY     = 'epaper-memo-v1';
const MAXLEN  = 1000;

const $ = (id) => document.getElementById(id);
let ch = null;
let state = { events: [], memo: '' };

// ---------- 保存と復元（ブラウザ内） ----------
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && Array.isArray(s.events)) state = { events: s.events, memo: s.memo || '' };
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

// ---------- 画面に出す文字を組み立てる ----------
function buildText() {
  const evs = state.events.filter((e) => (e.title || '').trim());
  const timed = evs.filter((e) => e.t).sort((a, b) => a.t.localeCompare(b.t));
  const untimed = evs.filter((e) => !e.t);
  const lines = [
    ...timed.map((e) => e.t + ' ' + e.title.trim()),
    ...untimed.map((e) => e.title.trim()),
  ];
  let text = lines.join('\n');
  const memo = state.memo.trim();
  if (memo) text += (text ? '\n\n' : '') + memo;
  return text;
}

function update() {
  save();
  const text = buildText();
  $('preview').textContent = text || '(空)';
  $('count').textContent = text.length + ' / ' + MAXLEN;
  $('count').style.color = text.length > MAXLEN ? 'crimson' : '';
  $('warn').textContent = /[^\x20-\x7E\n]/.test(text)
    ? '半角英数字と記号以外は、画面に表示されません' : '';
}

// ---------- 予定の入力欄 ----------
function renderRows() {
  const box = $('rows');
  box.innerHTML = '';
  state.events.forEach((ev, i) => {
    const row = document.createElement('div');
    row.className = 'row';

    const t = document.createElement('input');
    t.type = 'time';
    t.value = ev.t || '';
    t.oninput = () => { ev.t = t.value; update(); };

    const n = document.createElement('input');
    n.type = 'text';
    n.maxLength = 40;
    n.placeholder = '予定（半角英数字）';
    n.value = ev.title || '';
    n.oninput = () => { ev.title = n.value; update(); };

    const d = document.createElement('button');
    d.textContent = '×';
    d.onclick = () => { state.events.splice(i, 1); renderRows(); update(); };

    row.append(t, n, d);
    box.append(row);
  });
}

$('add').onclick = () => {
  state.events.push({ t: '', title: '' });
  renderRows();
  update();
};
$('memo').oninput = () => { state.memo = $('memo').value; update(); };
$('clear').onclick = () => {
  if (!confirm('入力した予定とメモを、すべて消しますか？')) return;
  state = { events: [], memo: '' };
  $('memo').value = '';
  renderRows();
  update();
};

// ---------- Bluetooth ----------
function setStatus(msg) { $('status').textContent = msg; }

if (!navigator.bluetooth) {
  setStatus('このブラウザはBluetoothに対応していません（Chrome / Edge を使ってください）');
  $('conn').disabled = true;
}

$('conn').onclick = async () => {
  try {
    setStatus('探しています…');
    const dev = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE] }]
    });
    dev.addEventListener('gattserverdisconnected', () => {
      ch = null;
      $('send').disabled = true;
      setStatus('切断されました。もう一度「接続」を押してください');
    });
    const srv = await dev.gatt.connect();
    const svc = await srv.getPrimaryService(SERVICE);
    ch = await svc.getCharacteristic(CHAR);
    // 接続したら、PCの現在時刻をESP32に渡す
    await ch.writeValueWithResponse(
      new TextEncoder().encode('\x04' + Math.floor(Date.now() / 1000)));
    $('send').disabled = false;
    setStatus('接続済み: ' + dev.name);
  } catch (e) {
    setStatus('接続できませんでした: ' + e.message);
  }
};

$('send').onclick = async () => {
  if (!ch) return;
  const text = buildText();
  if (text.length > MAXLEN) {
    alert('文字数が多すぎます（' + MAXLEN + '文字まで）');
    return;
  }
  try {
    $('send').disabled = true;
    setStatus('送信中…');
    const data = new TextEncoder().encode(text);
    await ch.writeValueWithResponse(Uint8Array.of(0x01));            // 開始
    for (let i = 0; i < data.length; i += CHUNK) {
      const part = data.slice(i, i + CHUNK);
      const buf = new Uint8Array(part.length + 1);
      buf[0] = 0x02;                                                  // 追加
      buf.set(part, 1);
      await ch.writeValueWithResponse(buf);
    }
    await ch.writeValueWithResponse(Uint8Array.of(0x03));            // 終了
    setStatus('送信しました（画面の更新に数秒かかります）');
  } catch (e) {
    setStatus('送信に失敗しました: ' + e.message);
  } finally {
    $('send').disabled = !ch;
  }
};

// ---------- 起動時 ----------
load();
$('memo').value = state.memo;
renderRows();
update();
</script>
</body>
</html>
